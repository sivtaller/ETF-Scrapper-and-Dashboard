<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETF Dashboard Builder</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>ETF Dashboard Builder</h1><p id="source">Local justETF research database</p></div><div><button id="csv">Export filtered CSV</button><button id="json">Export filtered JSON</button></div></header>
<main>
<section class="kpis"><div><span>Database</span><b id="rows">0</b></div><div><span>Columns</span><b id="cols">0</b></div><div><span>Visible</span><b id="visible">0</b></div><div><span>Selected</span><b id="selected">0</b></div></section>
<section class="panel saved"><div><label>Saved View</label><select id="viewSelect"><option value="">Select view...</option></select><button id="applyView">Apply</button><button id="updateView" class="light">Update</button><button id="duplicateView" class="light">Duplicate</button><button id="deleteView" class="danger">Delete</button></div><div><input id="viewName" placeholder="New view name"><button id="saveView">Save as new</button><button id="exportView" class="light">Export view</button><label class="importBtn">Import view<input id="importView" type="file" accept=".json"></label></div><div id="dirty" class="state">No view loaded</div></section>
<section id="viewMessage" class="panel message hidden"></section>
<section class="panel toolbar"><input id="q" placeholder="Search every column..."><button id="filtersBtn" class="light">Filters <span id="filterCount"></span></button><button id="columnsBtn" class="light">Columns</button><button id="compareBtn" class="light">Compare selected</button><button id="clearBtn" class="light">Clear view</button></section>
<section id="filterPanel" class="panel hidden"><div class="sectionHead"><div><h2>Dynamic filters</h2><p>Numeric columns show the current database range.</p></div><button id="addFilter" class="light">+ Add condition</button></div><div id="filterRows"></div></section>
<section id="columnsPanel" class="panel hidden"><div class="sectionHead"><h2>Visible columns</h2><div><button id="showAll" class="light">Show all</button><button id="hideTechnical" class="light">Hide technical</button></div></div><div id="columnChecks" class="checks"></div></section>
<section class="tablePanel"><div class="meta"><span id="range">0 rows</span><label>Rows <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label></div><div class="wrap"><table><thead></thead><tbody></tbody></table><p id="empty">No local data. Load a Screener first.</p></div><div class="pager"><button id="first" class="light">First</button><button id="prev" class="light">Previous</button><span id="pageInfo"></span><button id="next" class="light">Next</button><button id="last" class="light">Last</button></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalCard"><div class="sectionHead"><h2>ETF comparison</h2><button id="closeModal" class="light">Close</button></div><div id="compareTable" class="compareWrap"></div></div></div>
<script src="dashboard.js"></script></body></html>
